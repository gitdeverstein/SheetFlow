<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SheetFlow — The Enhanced Spreadsheet CRM for SMEs</title>
    <meta name="description" content="Manage your customers, products, and quotes in an interface as familiar as a spreadsheet, with the power of a CRM." />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SheetFlow — The Enhanced Spreadsheet CRM for SMEs" />
    <meta property="og:description" content="Manage your customers, products, and quotes in an interface as familiar as a spreadsheet, with the power of a CRM." />
    <meta property="og:site_name" content="SheetFlow" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SheetFlow — The Enhanced Spreadsheet CRM for SMEs" />
    <meta name="twitter:description" content="Manage your customers, products, and quotes in an interface as familiar as a spreadsheet, with the power of a CRM." />
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SheetFlow",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "SheetFlow is a modern spreadsheet-based CRM and inventory manager for SMEs, enabling customer tracking, inventory control, and real-time PDF quote generation."
      }
    </script>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
